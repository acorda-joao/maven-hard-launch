<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maven — The Irreplaceable Skills of 2026</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    .photo-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .photo-bg__grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      opacity: 0.14;
      filter: grayscale(80%) brightness(0.7);
      height: calc(100% + 120px);
      margin-top: -60px;
    }
    .photo-bg__item {
      background-size: cover;
      background-position: center top;
    }

    .page {
      position: relative;
      z-index: 1;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 56px;
      position: relative;
      z-index: 10;
    }
    .nav-logo {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: 24px;
      color: #fff;
      text-decoration: none;
      letter-spacing: -1px;
      font-feature-settings: 'ss01' 1;
    }
    .nav-tagline {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }

    .above-fold {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 56px;
    }
    .hero-headline {
      margin-bottom: 20px;
    }
    .hero-accent {
      color: var(--brand-light);
    }
    .hero-copy {
      color: rgba(255, 255, 255, 0.45);
      font-size: 16px;
      line-height: 1.65;
      max-width: 480px;
      margin-bottom: 28px;
    }
    .cta-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .cta-row .cta-button {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pills-row {
      display: flex;
      gap: 5px;
      justify-content: center;
      flex-wrap: wrap;
      user-select: none;
    }

    .face-strip {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      padding: 0 56px 40px;
    }
    .face-strip .instructor-card {
      min-height: 160px;
      border-radius: 8px;
    }

    .below-fold {
      padding: 60px 56px 80px;
    }

    .report-preview {
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      position: relative;
      overflow: hidden;
    }
    .report-preview::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, var(--lapis-900) 100%);
      pointer-events: none;
    }

    .race-chart__title {
      margin-bottom: 24px;
    }
    .race-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .race-bar__label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      width: 160px;
      flex-shrink: 0;
      text-align: right;
    }
    .race-bar__track {
      flex: 1;
      height: 20px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
      overflow: hidden;
    }
    .race-bar__fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1s ease;
    }

    .skill-map {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .skill-map__title {
      margin-bottom: 24px;
      align-self: flex-start;
    }
    .skill-map__chart {
      width: 220px;
      height: 220px;
    }
  </style>
</head>
<body>
  <div class="photo-bg">
    <div class="photo-bg__grid" id="photoBg"></div>
  </div>

  <div class="page">
    <div class="above-fold">
      <nav class="nav">
        <a class="nav-logo" href="#">maven</a>
        <span class="nav-tagline">Learn from Humans</span>
      </nav>

      <section class="hero">
        <h1 class="hero-headline headline-xl">
          The irreplaceable skills<br>
          <span class="hero-accent">of 2026</span>
        </h1>
        <p class="hero-copy">
          The skills reshaping your career. The experts who teach them.
          Your personalized report, built by Maven.
        </p>
        <div class="cta-row">
          <input type="email" class="email-input" placeholder="Enter your email">
          <button class="cta-button">Get your report</button>
        </div>
        <div class="pills-row" id="pillsRow"></div>
      </section>

      <section class="face-strip" id="faceStrip"></section>
    </div>

    <div class="below-fold">
      <div class="report-preview">
        <div class="race-chart">
          <h3 class="eyebrow race-chart__title">The Skills Race — 2025</h3>
          <div id="raceBars"></div>
        </div>
        <div class="skill-map">
          <h3 class="eyebrow skill-map__title">Your Skill Map</h3>
          <svg class="skill-map__chart" viewBox="0 0 200 200">
            <polygon points="100,20 169,60 169,140 100,180 31,140 31,60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
            <polygon points="100,47 146,73 146,127 100,153 54,127 54,73" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
            <polygon points="100,73 123,87 123,113 100,127 77,113 77,87" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
            <line x1="100" y1="20" x2="100" y2="180" stroke="rgba(255,255,255,0.04)" />
            <line x1="31" y1="60" x2="169" y2="140" stroke="rgba(255,255,255,0.04)" />
            <line x1="169" y1="60" x2="31" y2="140" stroke="rgba(255,255,255,0.04)" />
            <polygon points="100,36 148,76 162,136 100,148 52,128 72,68" fill="rgba(124,190,255,0.12)" stroke="var(--brand-light)" stroke-width="1.5" />
            <circle cx="100" cy="36" r="4" fill="var(--brand-light)" />
            <circle cx="148" cy="76" r="4" fill="var(--brand-light)" />
            <circle cx="162" cy="136" r="4" fill="var(--brand-light)" />
            <circle cx="100" cy="148" r="4" fill="var(--brand-light)" />
            <circle cx="52" cy="128" r="4" fill="var(--brand-light)" />
            <circle cx="72" cy="68" r="4" fill="var(--brand-light)" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BG_PHOTOS = [
      'shreyas-doshi.png', 'hamel-husain.jpg', 'marily-nika.jpg',
      'aishwarya-reganti.jpg', 'mahesh-yadav.png', 'ethan-evans.jpg',
      'wes-kao.jpg', 'colin-matthews.png', 'ronny-kohavi.jpg',
      'annie-duke.jpg', 'dave-kline.jpg', 'jason-liu.png',
      'jess-goldberg.jpg', 'ben-erez.jpg', 'vitaly-friedman.jpg',
      'caitlin-sullivan.jpg', 'elena-luneva.png', 'shaw-talebi.jpg',
      'hilary-gridley.png', 'everett-berry.jpg', 'aman-khan.jpg',
      'bryan-bischof.png', 'xinran-ma.png', 'shreyas-doshi.png'
    ];

    const FACE_STRIP = [
      { name: 'Shreyas Doshi', skill: 'Product Sense', img: 'shreyas-doshi.png' },
      { name: 'Hamel Husain', skill: 'AI Evals', img: 'hamel-husain.jpg' },
      { name: 'Marily Nika', skill: 'AI Products', img: 'marily-nika.jpg' },
      { name: 'Aishwarya Reganti', skill: 'Agentic AI', img: 'aishwarya-reganti.jpg' },
      { name: 'Ethan Evans', skill: 'Executive Influence', img: 'ethan-evans.jpg' },
      { name: 'Wes Kao', skill: 'Exec Communication', img: 'wes-kao.jpg' },
      { name: 'Colin Matthews', skill: 'Vibe Coding', img: 'colin-matthews.png' },
    ];

    const ROLES = ['Product', 'Engineering', 'Design', 'Marketing', 'Sales', 'Leadership', 'Founders'];

    const RACE_DATA = [
      { skill: 'Agentic AI', value: 100, color: '#3E89FF' },
      { skill: 'Vibe Coding', value: 85, color: '#71AEFF' },
      { skill: 'AI Evals', value: 75, color: '#2465E8' },
      { skill: 'AI Product Mgmt', value: 70, color: '#1E51CA' },
      { skill: 'Context Engineering', value: 52, color: '#1C41AB' },
      { skill: 'Multi-Agent Systems', value: 45, color: '#1C368D' },
    ];

    function renderPhotoBg() {
      document.getElementById('photoBg').innerHTML = BG_PHOTOS.map(img =>
        `<div class="photo-bg__item" style="background-image: url('../images/${img}')"></div>`
      ).join('');
    }

    function renderPills() {
      const container = document.getElementById('pillsRow');
      container.innerHTML = ROLES.map((role, i) =>
        `<span class="pill ${i === 0 ? 'pill--active' : 'pill--inactive'} role-pill" data-index="${i}">${role}</span>`
      ).join('');

      container.addEventListener('click', (e) => {
        const pill = e.target.closest('.role-pill');
        if (!pill) return;
        container.querySelectorAll('.role-pill').forEach((p, i) => {
          p.className = `pill ${parseInt(pill.dataset.index) === i ? 'pill--active' : 'pill--inactive'} role-pill`;
        });
      });
    }

    function renderFaceStrip() {
      document.getElementById('faceStrip').innerHTML = FACE_STRIP.map(inst =>
        `<div class="instructor-card" style="background-image: url('../images/${inst.img}')">
          <span class="instructor-card__name">${inst.name}</span>
          <span class="instructor-card__skill">${inst.skill}</span>
        </div>`
      ).join('');
    }

    function renderRaceBars() {
      document.getElementById('raceBars').innerHTML = RACE_DATA.map(d =>
        `<div class="race-bar">
          <span class="race-bar__label">${d.skill}</span>
          <div class="race-bar__track">
            <div class="race-bar__fill" style="width: ${d.value}%; background: ${d.color}"></div>
          </div>
        </div>`
      ).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPhotoBg();
      renderPills();
      renderFaceStrip();
      renderRaceBars();
    });
  </script>
</body>
</html>
